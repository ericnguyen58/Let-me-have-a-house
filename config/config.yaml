name: housing
version: 0.0.1
schema: v1

# Path to each directory
paths:
  root: Let-me-have-a-house/
  raw_data: data/raw/
  processed_data: data/processed/
  features_data: data/features/
  reports: reports/
  models: output/models/

# Data Source and params
sources:
  guilford:
    url: https://gcgis.guilfordcountync.gov/arcgis/rest/services/Tax/GCCadastral_FeatureToPointWGS84/FeatureServer/0/query
    page_size: 2000
  buncombe:
    url: https://gis.buncombecounty.org/arcgis/rest/services/opendata/FeatureServer/1/query
    page_size: 1000
  buncombe_building:
    url: https://services6.arcgis.com/VLA0ImJ33zhtGEaP/ArcGIS/rest/services/Real%20Estate%20Appraisal%20Residential%20Building%202025/FeatureServer/0/query
    page_size: 1000
params:
  where: "1=1"
  outFields: "*"
  f: json
  returnGeometry: true
  outSR: 4326

# hospital, park, everything else
nc_places:
  bbox: "-84.5,33.7,-75.4,36.6"