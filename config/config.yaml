name: housing
version: 0.0.1
schema: v1

# Path to each directory
paths:
  root: Let-me-have-a-house/
  raw_data: data/raw/
  processed_data: data/processed/
  features_data: data/features/
  reports: reports/
  models: output/models/

# ArcGIS sources for the other counties, used by data_ingestor.ingest(). Commented out
# while the project is Mecklenburg-only (that county's CSV is placed by hand).
# sources:
#   guilford:
#     url: https://gcgis.guilfordcountync.gov/arcgis/rest/services/Tax/GCCadastral_FeatureToPointWGS84/FeatureServer/0/query
#     page_size: 2000
#   buncombe:
#     url: https://gis.buncombecounty.org/arcgis/rest/services/opendata/FeatureServer/1/query
#     page_size: 1000
#   buncombe_building:
#     url: https://services6.arcgis.com/VLA0ImJ33zhtGEaP/ArcGIS/rest/services/Real%20Estate%20Appraisal%20Residential%20Building%202025/FeatureServer/0/query
#     page_size: 1000
params:
  where: "1=1"
  outFields: "*"
  f: json
  returnGeometry: true
  outSR: 4326

# hospital, park, everything else
nc_places:
  bbox: "-84.5,33.7,-75.4,36.6"

# Mecklenburg County GIS layers, saved to raw_data/meck_gis/{layer}.geojson
meck_gis:
  url: https://meckgis.mecklenburgcountync.gov/server/rest/services/{layer}/FeatureServer/0/query
  page_size: 2000
  layers:
    - CMSElementarySchoolDistricts
    - CMSMiddleSchoolDistricts
    - CMSHighSchoolDistricts
    - NeighborhoodProfileAreas
    - FEMAFloodplain
    - CATSLynxBlueLineStations
  # Quality of Life indicators per neighborhood profile area (NPA), attributes only
  quality_of_life:
    layer: NeighborhoodProfileAreas_QualityofLife
    indicators: [Violent_Crimes, Property_Crimes]
    year: "2022"

# NC School Report Card datasets (zips of xlsx files); only `files` are extracted
report_cards:
  urls:
    - https://www.dpi.nc.gov/src-data-set-2024-251-2/open
    - https://www.dpi.nc.gov/src-data-set-2024-252-2/open
  files: [rcd_acc_spg2.xlsx, rcd_location.xlsx]

# Zillow Home Value Index by county (monthly), for adjusting estimates to today's prices
zillow_zhvi: https://files.zillowstatic.com/research/public_csvs/zhvi/County_zhvi_uc_sfrcondo_tier_0.33_0.67_sm_sa_month.csv

# training.py: models per feature set (see training.FEATURE_SETS / MODEL_TYPES),
# hyperparameter-tuned via RandomizedSearchCV (search_iter candidates x cv_folds folds)
training:
  target: total_value
  test_size: 0.2
  random_state: 42
  search_iter: 15
  cv_folds: 3

# The houses every example run and check in the project uses (predict, search,
# market_estimate, notebooks/shap_explain.ipynb)
test_addresses:
  - 4817 Kelly Woods Ln, Charlotte NC 28277
  - 3612 Abbey Hill Ln, Charlotte NC 28210
  - 7631 Seton House Ln, Charlotte NC 28277

# Two houses for each path market_estimate.market_value can take, checked by
# `uv run python -m src.components.market_estimate houses`. `expect` is the path each
# took when chosen (October 2026); new sales or a retrained model can move a house to
# another path, which the check reports. Kept apart from test_addresses, which
# training.py forces into the test set - adding to it would change the training split.
market_test_houses:
  built_before_2023:  # county value x neighborhood ratio
    - address: 4817 Kelly Woods Ln, Charlotte NC 28277
      expect: {starting_value_source: county assessed value, ratio_method: neighborhood}
    - address: 3612 Abbey Hill Ln, Charlotte NC 28210
      expect: {starting_value_source: county assessed value, ratio_method: neighborhood}
  built_2023_or_later:  # full assessment keeps the county value; a partial one switches to the model
    - address: 333 Cranford Dr, Pineville NC
      expect: {starting_value_source: county assessed value, ratio_method: neighborhood}
    - address: 5204 Mint Harbor Wy, Charlotte NC
      expect: {starting_value_source: out-of-fold model, ratio_method: neighborhood}
  no_neighborhood_ratio:  # 60-month time-adjusted neighborhood ratio, then the area's ratio
    - address: 12020 Jumper Dr, Mint Hill NC
      expect: {starting_value_source: county assessed value, ratio_method: neighborhood_adjusted}
    - address: 7916 Pebbleridge Dr, Charlotte NC
      expect: {starting_value_source: county assessed value, ratio_method: area}
  what_if:  # the house with `changes` applied and no county value, so the model starts
    - address: 3612 Abbey Hill Ln, Charlotte NC 28210
      changes: {bedrooms: 5, heated_area: 2996}  # an addition: +1 bedroom, +400 sq ft
      expect: {starting_value_source: production model, ratio_method: neighborhood}
    - address: 4817 Kelly Woods Ln, Charlotte NC 28277
      changes: {bathrooms: 5.5}  # one more bathroom
      expect: {starting_value_source: production model, ratio_method: neighborhood}
