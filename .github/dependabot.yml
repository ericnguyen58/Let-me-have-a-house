# Weekly pull requests for outdated dependencies, grouped into one per ecosystem; CI
# checks each one.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      # minor and patch updates together; a major update (anthropic 1 -> 2) gets its own
      # pull request, so a breaking change doesn't hold back the rest
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # new digests of python:3.14 only: the Python version is also set by .python-version
      # and requires-python, so moving to 3.15 is a change by hand to all three
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
