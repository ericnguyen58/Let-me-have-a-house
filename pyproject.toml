[project]
name = "let-me-have-a-house"
version = "0.1.0"
description = "Estimate Mecklenburg County home assessed values from house, area and accessibility features"
readme = "README.md"
authors = [
    { name = "ericnguyen58", email = "ngdtoan58@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.8.0",
    "fastapi>=0.141.1",
    "geopandas>=1.1.4",
    "numpy>=2.5.2",
    "openpyxl>=3.1.5",
    "overturemaps>=1.0.2",
    "pandas",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "uvicorn>=0.54.0",
    "xgboost>=3.4.1",
]

[tool.uv]
package = false
default-groups = ["dev", "notebooks"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "nbconvert>=7.17.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
notebooks = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "seaborn>=0.13.2",
    "shap>=0.52.0",
]

[tool.ruff]
line-length = 120
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# the formatter wraps code at line-length; what is left over is long strings and comments
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# lambdas passed to .pipe() run inside the loop iteration that defines them
"src/components/evaluating.py" = ["B023"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
# importlib: the repository root has an __init__.py, which would make pytest import the
# tests under the repository folder's name
addopts = ["--import-mode=importlib", "-ra"]
markers = ["data: needs the local data/ and output/models/ files; skipped when they are missing (as in CI)"]
